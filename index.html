<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - RPG</title>
    <link rel="stylesheet" href="landing.css">
</head>
<body>
    <main class="main-menu-container">
        <header class="menu-header">
            <h1 class="game-title">The Infinite Map</h1>
        </header>

        <nav class="menu-buttons">
            
            <button id="btn-jugar" class="btn primary-btn" style="border-color: #4caf50; color: #4caf50;">
                🟢 MODO LOCAL
            </button>
            
            <button id="btn-online" class="btn" disabled style="cursor: not-allowed; opacity: 0.6; border-color: #2196f3; color: #2196f3; position: relative;">
                🔵 MODO ONLINE
                <span style="position: absolute; top: -10px; right: -15px; background: #e55353; color: white; font-size: 0.7rem; padding: 4px 8px; border-radius: 10px; font-weight: bold; letter-spacing: 1px; box-shadow: 0 2px 5px rgba(0,0,0,0.8); text-shadow: none;">
                    EN DESARROLLO
                </span>
            </button>

            <button id="btn-nueva-partida" class="btn">NUEVA PARTIDA</button>
            <button id="btn-cargar-partida" class="btn">CARGAR PARTIDA</button>
            <button id="btn-tienda" class="btn">TIENDA</button>
            
            <a href="https://link.mercadopago.com.mx/theinfinitemap" target="_blank" class="btn link-btn">DONACIÓN / APOYO</a>
        </nav>
    </main>

    <div id="modal-cargar" class="modal hidden">
        <div class="modal-content">
            <h2>Cargar Partida</h2>
            <p>Sube tu archivo JSON de guardado para continuar tu aventura.</p>
            
            <div class="upload-container">
                <input type="file" id="input-archivo-partida" accept=".json">
            </div>

            <div class="modal-actions">
                <button id="btn-procesar-carga" class="btn modal-btn">Importar e Iniciar</button>
                <button id="btn-cerrar-cargar" class="btn close-btn">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modal-tienda" class="modal hidden">
        <div class="modal-content shop-content">
            <h2>Tienda del Juego</h2>
            
            <div class="shop-categories-grid">
                <div class="shop-item">
                    <h3>Skins de personaje</h3>
                    <button class="btn buy-btn">Próximamente</button>
                </div>
                <div class="shop-item">
                    <h3>Armas</h3>
                    <button class="btn buy-btn">Próximamente</button>
                </div>
                <div class="shop-item">
                    <h3>Equipo</h3>
                    <button class="btn buy-btn">Próximamente</button>
                </div>
                <div class="shop-item">
                    <h3>Oro</h3>
                    <button class="btn buy-btn">Próximamente</button>
                </div>
                <div class="shop-item">
                    <h3>Experiencia</h3>
                    <button class="btn buy-btn">Próximamente</button>
                </div>
                <div class="shop-item">
                    <h3>Skins de mapa</h3>
                    <button class="btn buy-btn">Próximamente</button>
                </div>
            </div>

            <div class="modal-actions">
                <button id="btn-cerrar-tienda" class="btn close-btn">Volver al menú principal</button>
            </div>
        </div>
    </div>

    <script src="landing.js"></script>
</body>
</html>
